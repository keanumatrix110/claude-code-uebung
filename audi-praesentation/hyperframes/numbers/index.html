<!doctype html><html lang="de"><head><meta charset="UTF-8"/>
<script src="gsap.min.js"></script><link rel="stylesheet" href="base.css"/>
<style>
#head{left:135px;top:110px}#title{left:135px;top:160px;font-family:"Inter";font-weight:700;font-size:88px}
.card{position:absolute;top:390px;width:390px;height:430px;border-radius:28px;background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.09);padding:46px 34px}
.num{font-family:"Inter";font-weight:700;font-size:80px;line-height:1;letter-spacing:-.02em}
.unit{font-size:34px;color:var(--silver);font-weight:500;margin-top:14px}
.desc{font-size:28px;color:var(--muted);margin-top:40px;line-height:1.35}
.bar{position:absolute;left:34px;right:34px;bottom:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.fill{height:100%;width:0;border-radius:3px;background:var(--red)}
#src{left:135px;top:940px;font-size:22px;color:#6b7078}
</style></head><body>
<div id="root" data-composition-id="numbers" data-start="0" data-duration="8" data-width="1920" data-height="1080">
 <div class="grain"></div>
 <div id="head" class="abs kicker">Audi Konzern · Geschäftsjahr 2025</div>
 <div id="title" class="abs">Kennzahlen</div>
 <div class="card" id="c0" style="left:135px"><div class="num" id="n0">0</div><div class="unit">Mrd. Euro</div><div class="desc">Umsatzerlöse des Konzerns</div><div class="bar"><div class="fill"></div></div></div>
 <div class="card" id="c1" style="left:555px"><div class="num" id="n1">0</div><div class="unit">Mio. Fahrzeuge</div><div class="desc">Auslieferungen der Marke Audi</div><div class="bar"><div class="fill"></div></div></div>
 <div class="card" id="c2" style="left:975px"><div class="num" id="n2">0</div><div class="unit">Elektroautos</div><div class="desc">ausgeliefert, rund +36&nbsp;% zum Vorjahr</div><div class="bar"><div class="fill"></div></div></div>
 <div class="card" id="c3" style="left:1395px"><div class="num" id="n3">0</div><div class="unit">Beschäftigte</div><div class="desc">zum Jahresende 2025</div><div class="bar"><div class="fill"></div></div></div>
 <div id="src" class="abs">Quelle: Audi Quarterly Update FY2025, Audi Pressemitteilung vom 17.03.2026</div>
</div>
<script>
const de=(v,d)=>v.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const T=[{v:65.5,d:1,s:""},{v:1.62,d:2,s:""},{v:223,d:0,s:".000"},{v:84,d:0,s:".186"}];
const tl=gsap.timeline({paused:true});
tl.fromTo(["#head","#title"],{opacity:0,y:30},{opacity:1,y:0,duration:.8,ease:"power3.out",stagger:.15},.2);
T.forEach((t,i)=>{
 const o={x:0},el=document.getElementById("n"+i),at=.9+i*.3;
 tl.fromTo("#c"+i,{opacity:0,y:80},{opacity:1,y:0,duration:.9,ease:"power3.out"},at);
 tl.fromTo(o,{x:0},{x:t.v,duration:2.2,ease:"power2.out",onUpdate:()=>{el.textContent=de(o.x,t.d)+(o.x>=t.v-1e-6?t.s:"")},
   onComplete:()=>{el.textContent=de(t.v,t.d)+t.s}},at+.2);
 tl.fromTo("#c"+i+" .fill",{width:"0%"},{width:"100%",duration:2.2,ease:"power2.out"},at+.2);
});
tl.fromTo("#src",{opacity:0},{opacity:1,duration:.8},3.6);
window.__timelines=window.__timelines||{};window.__timelines["numbers"]=tl;tl.seek(0);
</script></body></html>
