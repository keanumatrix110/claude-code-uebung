<!doctype html><html lang="de"><head><meta charset="UTF-8"/>
<script src="gsap.min.js"></script><link rel="stylesheet" href="base.css"/>
<style>
#head{left:140px;top:110px}
#title{left:140px;top:160px;font-family:"Inter";font-weight:700;font-size:88px;letter-spacing:-.01em}
.ring{position:absolute;top:400px;width:260px;height:260px;border-radius:50%;border:18px solid #d9dce1;
 box-shadow:0 0 40px rgba(255,255,255,.08), inset 0 0 30px rgba(255,255,255,.06)}
.lab{position:absolute;top:705px;width:300px;text-align:center;font-size:44px;font-weight:600}
.yr{position:absolute;top:765px;width:300px;text-align:center;font-size:26px;color:var(--muted);font-weight:400}
#claim{left:0;right:0;top:880px;text-align:center;font-size:40px;font-weight:300;color:var(--silver)}
#claim b{color:var(--ink);font-weight:600}
#red{width:14px;height:14px;border-radius:50%;background:var(--red);left:140px;top:118px}
#head{left:172px}
</style></head><body>
<div id="root" data-composition-id="rings" data-start="0" data-duration="9" data-width="1920" data-height="1080">
 <div class="grain"></div>
 <div id="red" class="abs"></div>
 <div id="head" class="abs kicker">29. Juni 1932 · Chemnitz</div>
 <div id="title" class="abs">Auto Union AG</div>
 <div class="ring" id="r0"></div><div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>
 <div class="lab" id="l0">Audi</div><div class="lab" id="l1">DKW</div><div class="lab" id="l2">Horch</div><div class="lab" id="l3">Wanderer</div>
 <div class="yr" id="y0">Zwickau</div><div class="yr" id="y1">Zschopau</div><div class="yr" id="y2">Zwickau</div><div class="yr" id="y3">Chemnitz</div>
 <div id="claim" class="abs">Vier Marken. <b>Ein Zeichen.</b></div>
</div>
<script>
// spread positions (centers) and final interlocked positions
const spread=[330,750,1170,1590], tight=[660,860,1060,1260];
const tl=gsap.timeline({paused:true});
tl.fromTo(["#red","#head"],{opacity:0,x:-30},{opacity:1,x:0,duration:.7,ease:"power3.out"},.2);
tl.fromTo("#title",{opacity:0,y:30},{opacity:1,y:0,duration:.9,ease:"power3.out"},.4);
for(let i=0;i<4;i++){
 gsap.set("#r"+i,{left:spread[i]-130});gsap.set(["#l"+i,"#y"+i],{left:spread[i]-150});
 const t=1.0+i*.55;
 tl.fromTo("#r"+i,{opacity:0,scale:.4,rotation:-90},{opacity:1,scale:1,rotation:0,duration:.9,ease:"back.out(1.6)"},t);
 tl.fromTo(["#l"+i,"#y"+i],{opacity:0,y:24},{opacity:1,y:0,duration:.6,ease:"power3.out",stagger:.08},t+.25);
}
tl.to(["#l0","#l1","#l2","#l3","#y0","#y1","#y2","#y3"],{opacity:0,y:-10,duration:.5,ease:"power2.in"},4.6);
for(let i=0;i<4;i++){ tl.to("#r"+i,{x:tight[i]-spread[i],y:-10,duration:1.3,ease:"power4.inOut"},4.8); }
tl.fromTo("#claim",{opacity:0,y:20},{opacity:1,y:0,duration:.9,ease:"power3.out"},6.0);
window.__timelines=window.__timelines||{};window.__timelines["rings"]=tl;tl.seek(0);
</script></body></html>
